[project]
name = "borg-tracker"
version = "0.1.0"
description = "AI commit adoption tracker — Resistance is futile"
requires-python = ">=3.11"
dependencies = [
    "textual>=3.0",
    "textual-plotext>=0.5",
    "typer>=0.15",
    "httpx>=0.28",
]

[project.scripts]
borg = "borg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/borg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
